version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node 22 types match the Node version CI and the host run (#11).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Security fixes arrive as one grouped PR instead of many.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      # Routine version bumps: minor and patch only, grouped.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
